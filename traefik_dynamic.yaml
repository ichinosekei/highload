http:
  routers:
    catalog:
      rule: "PathPrefix(`/api/v1/catalog`) || PathPrefix(`/api/v1/search`)"
      service: catalog
      entryPoints:
        - web
      middlewares:
        - catalog-ratelimit
        - compress

    order:
      rule: "PathPrefix(`/api/v1/orders`)"
      service: order
      entryPoints:
        - web
      middlewares:
        - order-ratelimit
        - compress

    payment:
      rule: "PathPrefix(`/api/v1/payments`)"
      service: payment
      entryPoints:
        - web
      middlewares:
        - payment-ratelimit
        - compress

    notification:
      rule: "PathPrefix(`/api/v1/notifications`)"
      service: notification
      entryPoints:
        - web
      middlewares:
        - compress

  middlewares:
    catalog-ratelimit:
      rateLimit:
        average: 2000
        burst: 500
    order-ratelimit:
      rateLimit:
        average: 500
        burst: 200
    payment-ratelimit:
      rateLimit:
        average: 200
        burst: 100
    compress:
      compress: {}

  services:
    catalog:
      loadBalancer:
        servers:
          - url: "http://catalog:8080"
        healthCheck:
          path: /api/v1/catalog/health
          interval: "5s"
          timeout: "3s"
        responseForwarding:
          flushInterval: "100ms"

    order:
      loadBalancer:
        servers:
          - url: "http://order:8082"
        healthCheck:
          path: /api/v1/orders/health
          interval: "5s"
          timeout: "3s"

    payment:
      loadBalancer:
        servers:
          - url: "http://payment:8083"
        healthCheck:
          path: /api/v1/payments/health
          interval: "5s"
          timeout: "3s"

    notification:
      loadBalancer:
        servers:
          - url: "http://notification:8081"
        healthCheck:
          path: /api/v1/notifications/health
          interval: "5s"
          timeout: "3s"
