# --- Memory ---
# Cache hot data in RAM to avoid HDD reads.
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 128MB

# --- WAL / Write Performance ---
# Reduce fsync overhead on HDD: batch WAL writes.
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB

# --- Connections ---
max_connections = 200

# --- Planner ---
# HDD has high random I/O cost; bias planner toward sequential scans.
random_page_cost = 4.0
effective_io_concurrency = 2

# --- Logging (minimal for perf) ---
log_min_duration_statement = 1000
log_statement = 'none'
